<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>คลังสื่อการสอน | ห้องเรียนออนไลน์ วิชาเทคโนโลยี</title>

  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- QRCodeJS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='36' font-family='sans-serif' font-weight='bold'%3ET%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
  <!-- Shared Navbar -->
  <div id="app-navbar"></div>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
    <!-- Page Header -->
    <div class="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-700 rounded-3xl p-6 sm:p-8 text-white shadow-lg mb-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <span class="inline-block text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full bg-white/15 text-blue-100 mb-2">
            Teaching Media Hub
          </span>
          <h1 class="text-2xl sm:text-3xl font-bold">คลังสื่อการสอน</h1>
          <p class="text-sm sm:text-base text-blue-100 mt-1">
            เลือกดูสื่อตามรายวิชา ระดับชั้น และหน่วยการเรียนรู้ พร้อมโหมดเปิดสอนเต็มหน้าจอและ QR Code สำหรับนักเรียน
          </p>
        </div>
        <div class="bg-white/15 backdrop-blur-sm border border-white/20 rounded-2xl px-5 py-3 text-center shrink-0">
          <div class="text-xs text-blue-100">สื่อทั้งหมดที่แสดง</div>
          <div id="media-count" class="text-2xl font-bold">-</div>
        </div>
      </div>
    </div>

    <!-- Filter Panel -->
    <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-xs mb-8 space-y-5">
      <!-- Subject Pills -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2.5">กรองตามรายวิชา</label>
        <div id="subject-filter-group" class="flex flex-wrap gap-2">
          <button data-subject="ALL" class="subject-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-slate-800 text-white shadow-xs">
            ทุกรายวิชา
          </button>
          <button data-subject="วิทยาการคำนวณ" class="subject-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white text-blue-700 border border-blue-200 hover:bg-blue-50">
            วิทยาการคำนวณ
          </button>
          <button data-subject="EEC" class="subject-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white text-green-700 border border-green-200 hover:bg-green-50">
            วิชา EEC
          </button>
          <button data-subject="ชุมนุม" class="subject-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white text-purple-700 border border-purple-200 hover:bg-purple-50">
            กิจกรรมชุมนุม
          </button>
        </div>
      </div>

      <!-- Grade, Unit & Search Controls -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2 border-t border-slate-100">
        <div>
          <label for="grade-filter" class="block text-xs font-semibold text-slate-600 mb-1.5">ระดับชั้น</label>
          <select id="grade-filter"
                  class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
            <option value="ALL">ทุกระดับชั้น</option>
          </select>
        </div>

        <div>
          <label for="unit-filter" class="block text-xs font-semibold text-slate-600 mb-1.5">หน่วยการเรียนรู้</label>
          <select id="unit-filter"
                  class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
            <option value="ALL">ทุกหน่วยการเรียนรู้</option>
          </select>
        </div>

        <div>
          <label for="media-search" class="block text-xs font-semibold text-slate-600 mb-1.5">ค้นหาชื่อสื่อ</label>
          <div class="relative">
            <input id="media-search"
                   type="text"
                   placeholder="พิมพ์คำค้นหา เช่น ผังงาน, IoT..."
                   class="w-full rounded-xl border border-slate-300 bg-slate-50 pl-10 pr-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white" />
            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
        </div>
      </div>
    </section>

    <!-- Media Grid -->
    <section id="media-list-container"></section>
  </main>

  <!-- Shared Footer -->
  <div id="app-footer"></div>

  <!-- Scripts -->
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/classroom-kit.js"></script>
  <script>
    (() => {
      let allMedia = [];
      let selectedSubject = "ALL";
      let selectedGrade = "ALL";
      let selectedUnit = "ALL";
      let searchQuery = "";

      function getTypeIcon(type) {
        const t = String(type || "").toLowerCase();
        if (t.includes("video") || t.includes("วิดีโอ") || t.includes("youtube")) return "🎬";
        if (t.includes("slide") || t.includes("สไลด์") || t.includes("ppt")) return "📊";
        if (t.includes("pdf") || t.includes("doc") || t.includes("เอกสาร")) return "📄";
        if (t.includes("game") || t.includes("เกม") || t.includes("quiz")) return "🎮";
        return "📚";
      }

      function populateDropdowns() {
        const gradeSelect = document.getElementById("grade-filter");
        const unitSelect = document.getElementById("unit-filter");

        // กรองรายการตามวิชาที่เลือกก่อน เพื่อสร้างตัวเลือกระดับชั้นที่เกี่ยวข้อง
        const bySubject = allMedia.filter((m) =>
          selectedSubject === "ALL" || String(m.Subject || "").trim() === selectedSubject
        );

        const grades = [...new Set(bySubject.map((m) => String(m.Grade || "").trim()).filter(Boolean))];
        const currentGrade = grades.includes(selectedGrade) ? selectedGrade : "ALL";
        selectedGrade = currentGrade;

        gradeSelect.innerHTML = `<option value="ALL">ทุกระดับชั้น</option>` +
          grades.map((g) => `<option value="${Layout.escapeHtml(g)}" ${g === selectedGrade ? "selected" : ""}>${Layout.escapeHtml(g)}</option>`).join("");

        // กรองตามระดับชั้นเพื่อสร้างตัวเลือกหน่วยการเรียนรู้
        const byGrade = bySubject.filter((m) =>
          selectedGrade === "ALL" || String(m.Grade || "").trim() === selectedGrade
        );
        const units = [...new Set(byGrade.map((m) => String(m.Unit || "").trim()).filter(Boolean))];
        const currentUnit = units.includes(selectedUnit) ? selectedUnit : "ALL";
        selectedUnit = currentUnit;

        unitSelect.innerHTML = `<option value="ALL">ทุกหน่วยการเรียนรู้</option>` +
          units.map((u) => `<option value="${Layout.escapeHtml(u)}" ${u === selectedUnit ? "selected" : ""}>${Layout.escapeHtml(u)}</option>`).join("");
      }

      function renderMediaCards() {
        const container = document.getElementById("media-list-container");
        const countEl = document.getElementById("media-count");
        const q = searchQuery.trim().toLowerCase();

        const filtered = allMedia.filter((item) => {
          const matchSubject = selectedSubject === "ALL" || String(item.Subject || "").trim() === selectedSubject;
          const matchGrade = selectedGrade === "ALL" || String(item.Grade || "").trim() === selectedGrade;
          const matchUnit = selectedUnit === "ALL" || String(item.Unit || "").trim() === selectedUnit;
          const matchQuery = !q || [item.Title, item.Unit, item.Subject, item.Grade, item.Type, item.ID]
            .some((v) => String(v || "").toLowerCase().includes(q));
          return matchSubject && matchGrade && matchUnit && matchQuery;
        });

        countEl.textContent = filtered.length.toLocaleString("th-TH");

        if (filtered.length === 0) {
          container.innerHTML = Layout.renderEmpty("ไม่พบสื่อการสอนที่ตรงกับเงื่อนไขการกรอง");
          return;
        }

        const cardsHtml = filtered.map((item, idx) => {
          const style = APP_CONFIG.getSubjectStyle(item.Subject);
          const typeIcon = getTypeIcon(item.Type);

          return `
            <article class="bg-white rounded-3xl border border-slate-200/80 shadow-xs hover:shadow-lg transition-all flex flex-col overflow-hidden animate-fade-in">
              <!-- Top Accent Bar -->
              <div class="h-1.5 w-full ${style.bgClass}"></div>

              <div class="p-5 sm:p-6 flex-1 flex flex-col">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold ${style.badgeClass}">
                    ${Layout.escapeHtml(item.Subject || "ทั่วไป")}
                  </span>
                  <div class="flex items-center gap-1.5">
                    ${item.Grade ? `<span class="text-xs font-medium px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">${Layout.escapeHtml(item.Grade)}</span>` : ""}
                    <span class="text-xs font-medium px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700">
                      ${typeIcon} ${Layout.escapeHtml(item.Type || "สื่อ")}
                    </span>
                  </div>
                </div>

                <p class="text-xs font-semibold ${style.textClass} mb-1">
                  ${Layout.escapeHtml(item.Unit || "หน่วยการเรียนรู้ทั่วไป")}
                </p>

                <h3 class="text-base sm:text-lg font-bold text-slate-800 leading-snug mb-4 flex-1">
                  ${Layout.escapeHtml(item.Title)}
                </h3>

                <!-- Action Buttons -->
                <div class="flex items-center gap-2 pt-4 border-t border-slate-100">
                  <button type="button"
                          data-action="preview"
                          data-index="${idx}"
                          class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl ${style.bgClass} ${style.hoverClass} text-white text-sm font-semibold shadow-xs transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                    </svg>
                    เปิดสอนเต็มจอ
                  </button>

                  <button type="button"
                          data-action="qr"
                          data-index="${idx}"
                          title="สร้าง QR Code ให้เด็กสแกน"
                          class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                    </svg>
                    <span>QR</span>
                  </button>
                </div>
              </div>
            </article>
          `;
        }).join("");

        container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${cardsHtml}</div>`;

        // Bind modal events
        container.querySelectorAll("button[data-action]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const item = filtered[Number(btn.dataset.index)];
            if (!item) return;

            if (btn.dataset.action === "preview") {
              ClassroomKit.openPreviewModal({
                title: item.Title,
                subtitle: `${item.Grade ? item.Grade + " • " : ""}${item.Unit || ""}`,
                badge: item.Subject,
                url: item.Link
              });
            } else if (btn.dataset.action === "qr") {
              ClassroomKit.openQrModal({
                title: item.Title,
                subtitle: `${item.Subject || ""}${item.Grade ? " • " + item.Grade : ""}`,
                url: item.Link
              });
            }
          });
        });
      }

      function updateSubjectButtonsUI() {
        document.querySelectorAll(".subject-btn").forEach((btn) => {
          const subj = btn.dataset.subject;
          const active = subj === selectedSubject;
          btn.className = "subject-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all ";

          if (active) {
            if (subj === "วิทยาการคำนวณ") btn.className += "bg-blue-600 text-white shadow-sm";
            else if (subj === "EEC") btn.className += "bg-green-600 text-white shadow-sm";
            else if (subj === "ชุมนุม") btn.className += "bg-purple-600 text-white shadow-sm";
            else btn.className += "bg-slate-800 text-white shadow-sm";
          } else {
            if (subj === "วิทยาการคำนวณ") btn.className += "bg-white text-blue-700 border border-blue-200 hover:bg-blue-50";
            else if (subj === "EEC") btn.className += "bg-white text-green-700 border border-green-200 hover:bg-green-50";
            else if (subj === "ชุมนุม") btn.className += "bg-white text-purple-700 border border-purple-200 hover:bg-purple-50";
            else btn.className += "bg-white text-slate-700 border border-slate-200 hover:bg-slate-50";
          }
        });
      }

      function bindEvents() {
        document.querySelectorAll(".subject-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            selectedSubject = btn.dataset.subject;
            selectedGrade = "ALL";
            selectedUnit = "ALL";
            updateSubjectButtonsUI();
            populateDropdowns();
            renderMediaCards();
          });
        });

        document.getElementById("grade-filter").addEventListener("change", (e) => {
          selectedGrade = e.target.value;
          selectedUnit = "ALL";
          populateDropdowns();
          renderMediaCards();
        });

        document.getElementById("unit-filter").addEventListener("change", (e) => {
          selectedUnit = e.target.value;
          renderMediaCards();
        });

        document.getElementById("media-search").addEventListener("input", (e) => {
          searchQuery = e.target.value;
          renderMediaCards();
        });
      }

      async function init() {
        // รองรับการส่ง ?subject=... มาจากหน้าแรก
        const urlParams = new URLSearchParams(window.location.search);
        const initialSubj = urlParams.get("subject");
        if (initialSubj && ["วิทยาการคำนวณ", "EEC", "ชุมนุม"].includes(initialSubj)) {
          selectedSubject = initialSubj;
          updateSubjectButtonsUI();
        }

        bindEvents();

        const container = document.getElementById("media-list-container");
        container.innerHTML = Layout.renderLoading("กำลังโหลดรายการสื่อการสอน...");

        try {
          const res = await API.getSheetData("Teaching_Media");
          allMedia = Array.isArray(res.data) ? res.data : [];
          populateDropdowns();
          renderMediaCards();
        } catch (err) {
          container.innerHTML = Layout.renderError(err.message);
          document.getElementById("media-count").textContent = "0";
        }
      }

      document.addEventListener("DOMContentLoaded", init);
    })();
  </script>
</body>
</html>
